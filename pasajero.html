<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>NUEVO PASAJERO</title>
    <link rel="stylesheet" href="css/pasajero.css">    
<link rel="stylesheet" href="css/layout2.css"></head>
<body>
    <div id="app-header"></div>

    <div class="flex">
        <div id="app-sidebar"></div>
        <main>

        <div id="superBus">
            <div id="bus"></div>
        </div>
        <div id="lista">
            <div id="title"></div>
            <div id="allDina">
		        <div id="dinamic"></div>
                <div class="flexiDat">
                    <h2>PRECIO POR ASIENTO:</h2>
                    <input type="number" placeholder="PRECIO" name="pr" maxlength="5" oninput="this.value = this.value.replace(/[^0-9]/g, '')" list="l2-list" required>
                </div>
                <div class="flexiDat">
                    <h2>DESTINO:</h2>
                    <input id="dest" type="text" placeholder="DESTINO" name="ds" maxlength="25">
                </div>
                <div class="flexiDat">
                    <h2>ASIENTO:</h2>
                    <input id="asH" type="text" placeholder="ASIENTO" name="as" oninput="this.value = this.value.replace(/[^0-9]/g, ',')" list="l2-list" autocomplete="off">
                </div>                    
            </div>
    </main>
    </div>
    </div>
    <div id="printP" style="display: none;"></div>

    <script>
        window.PAGE_TITLE = "NUEVO PASAJERO";
        window.PAGE_BUTTONS = [
            { id: "crear", emoji: "\ud83d\udcbe", label: "GUARDAR", onclick: "crear()" },
            { id: "back", emoji: "\u2b05", label: "ATRAS", onclick: "back()" }
        ];
    </script>
    <script src="components/layout.js"></script>
    <script src="js/pasajero.js"></script>
</body>
</html>
