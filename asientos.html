<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Editor de Bus</title>
  <link rel="stylesheet" href="css/asientos.css">
<link rel="stylesheet" href="css/layout2.css"></head>
<body>
<div id="app-header"></div>
<div class="flex">
        <div id="app-sidebar"></div>
        <main>
    <div>
        <div id="bus"></div>
    </div>
    <div id="options">
        <div>
            <h2 id="fh2o">N° de FILA de ASIENTOS</h2>
            <div class="butOps">
                <button class="biAsi" onclick="asi(3)">3</button>
                <button class="biAsi" onclick="asi(4)">4</button>
            </div>
        </div>
        <div>
            <h2>N° de PUERTAS</h2>
            <div class="butOps">
                <button class="biPue" onclick="pue(1)">1</button>
                <button class="biPue" onclick="pue(2)">2</button>
                <button class="biPue" onclick="pue(3)">3</button>
            </div>
        </div>
        <div>
            <h2>N° de BAÑOS</h2>
            <div class="butOps">
                <button class="biBan" onclick="ban(1)">1</button>
                <button class="biBan" onclick="ban(2)">2</button>
            </div>
        </div>
        <div>
            <h2>N° de TV</h2>
            <div class="butOps">
                <button class="biTv" onclick="tv(1)">1</button>
                <button class="biTv" onclick="tv(2)">2</button>
                <button class="biTv" onclick="tv(3)">3</button>
            </div>
        </div>
        <br>
        <h2>NOMBRE DE PLANILLA</h2>
        <input id="busName" type="text" placeholder="Ingrese el nombre de la PLANILLA">
        <button id="sav" onclick="guardarPosiciones()">
            <span class="emoji">💾</span>
            <span>GUARDAR</span>
        </button>
    </div>
    
</main>
    </div>
    <script>
        window.PAGE_TITLE = "DISEÑO DE ASIENTOS DEL BUS";
        window.PAGE_BUTTONS = [
            { id: "asiento", emoji: "\ud83d\ude8c", label: "ASIENTO", onclick: "agregarAsiento()" },
            { id: "puerta", emoji: "\ud83d\udeaa", label: "PUERTA", onclick: "agregarElemento('puerta')" },
            { id: "banio", emoji: "\ud83d\udebd", label: "BAÑO", onclick: "agregarElemento('baño')" },
            { id: "tv", emoji: "\ud83d\udcfa", label: "TV", onclick: "agregarElemento('tv')" },
            { id: "piso2", emoji: "\ud83c\udfd7", label: "PISO", onclick: "agregarElemento('2do piso')" },
            { id: "reset", emoji: "\ud83d\udd04", label: "RESTAURAR", onclick: "reset()" },
            { id: "del", emoji: "\ud83d\uddd1", label: "ELIMINAR", onclick: "activarModoEliminar()" },
            { id: "back", emoji: "\u2b05", label: "ATRAS", onclick: "back()" }
        ];
    </script>
    <script src="components/layout.js"></script>
    <script src="js/asientos.js"></script>
</body>
</html>
