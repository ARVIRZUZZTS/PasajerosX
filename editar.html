<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>EDITAR INFORMACION DEL VIAJE</title>
    <link rel="stylesheet" href="css/editar.css">
<link rel="stylesheet" href="css/layout2.css"></head>
<body>
    <div id="app-header"></div>

    <div class="flex">
        <div id="app-sidebar"></div>
        <main>

        <div id="superBus">
            <div id="bus"></div>
        </div>
        <div id="lista">
                    <div id="top">
            <h2 id="titleDat">DATOS DEL VIAJE</h2>
            <div id="entradas">
                <div>
                    <div class="field">
                        <label class="label" for="propietario">PROPIETARIO:</label>
                        <input type="text" id="propietario" maxlength="150" placeholder="PROPIETARIO" readonly>
                    </div>
                    <div class="field">
                        <label class="label" for="c1">CONDUCTOR 1:</label>
                        <input type="text" id="c1" maxlength="150" placeholder="CONDUCTOR 1" name="c1" list="c1-list" autocomplete="off">
                        <datalist id="c1-list"></datalist>
                    </div>
                    <div class="field">
                        <label class="label" for="c2">CONDUCTOR 2:</label>
                        <input type="text" id="c2" maxlength="150" placeholder="CONDUCTOR 2" name="c2" list="c2-list" autocomplete="off">
                        <datalist id="c2-list"></datalist>
                    </div>
                    <div class="field">
                        <label class="label" for="ay">AYUDANTE:</label>
                        <input type="text" id="ay" maxlength="150" placeholder="AYUDANTE" name="ay" list="ay-list" autocomplete="off">
                        <datalist id="ay-list"></datalist>
                    </div>
                    <div class="field">
                        <label class="label" for="pl">PLACA:</label>
                        <input type="text" id="pl" maxlength="20" placeholder="PLACA" name="pl" list="pl-list" autocomplete="off">
                        <datalist id="pl-list"></datalist>
                    </div>
                    <div class="field">
                        <label class="label" for="fe">FECHA:</label>
                        <input type="text" id="fe" maxlength="10" placeholder="FECHA" name="fe">
                    </div>
                </div>
                <div>
                    <div class="field">
                        <label class="label" for="l1">LICENCIA 1:</label>
                        <input class="der" type="text" id="l1" maxlength="20" placeholder="LICENCIA 1" name="l1" list="l1-list" autocomplete="off" oninput="this.value = this.value.replace(/[^0-9]/g, '')">
                        <datalist id="l1-list"></datalist>
                    </div>
                    <div class="field">
                        <label class="label" for="l2">LICENCIA 2:</label>
                        <input class="der" type="text" id="l2" maxlength="20" placeholder="LICENCIA 2" name="l2" list="l2-list" autocomplete="off" oninput="this.value = this.value.replace(/[^0-9]/g, '')">
                        <datalist id="l2-list"></datalist>
                    </div>
                    <div class="field">
                        <label class="label" for="dt">DESTINO:</label>
                        <input class="der" type="text" id="dt" maxlength="20" placeholder="DESTINO" name="dt" list="dt-list" autocomplete="off">
                        <datalist id="dt-list">
                            <option value="Cochabamba">
                            <option value="La Paz">
                        </datalist>
                    </div>
                    <div class="field">
                        <label class="label" for="planilla">PLANILLA:</label>
                        <input class="der" type="text" id="planilla" maxlength="150" placeholder="PLANILLA" name="planilla" readonly>
                    </div>
                    <div class="field">
                        <label class="label" for="hr">HORA:</label>
                        <input class="der" type="text" id="hr" maxlength="10" placeholder="HORA" name="hr" list="hr-list" autocomplete="off">
                        <datalist id="hr-list"></datalist>
                    </div>
                    <div class="field">
                        <label class="label" for="ca">CARRIL:</label>
                        <input class="der" type="text" id="ca" maxlength="10" placeholder="CARRIL" name="ca" list="ca-list" autocomplete="off" oninput="this.value = this.value.replace(/[^0-9]/g, '')">
                        <datalist id="ca-list"></datalist>
                    </div>
                </div>
            </div>
        </div>
        <div id="boxi">
                <div id="titleBoxi">
                    <h4 id="tb1">N°</h4>
                    <h4 id="tb2">NOMBRE</h4>
                    <h4 id="tb3">CI</h4>
                    <h4 id="tb4">PRECIO</h4>
                </div>
                <hr>
                <div id="dinamic"></div>
            </div>
        </div>
    </main>
    </div>
    </div>

    <script>
        window.PAGE_TITLE = "EDITAR INFORMACION DEL VIAJE";
        window.PAGE_BUTTONS = [
            { id: "save", emoji: "\ud83d\udcbe", label: "GUARDAR", onclick: "save()" },
            { id: "back", emoji: "\u2b05", label: "ATRAS", onclick: "back()" }
        ];
    </script>
    <script src="components/layout.js"></script>
    <script src="js/editar.js"></script>
</body>
</html>
